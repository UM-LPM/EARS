plugins {
    id 'java'
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '2.25.0'
    id 'org.jetbrains.kotlin.jvm' version '2.2.0'
}

def minJava = 17
if (JavaVersion.current().majorVersion.toInteger() < minJava) {
    throw new GradleException(
            "EARS requires Java ${minJava} or newer to build.\n" +
                    "You are running Java ${JavaVersion.current()}.\n" +
                    "Install a JDK ${minJava}+ and point IntelliJ at it in\n" +
                    "Settings > Build Tools > Gradle > Gradle JVM."
    )
}

idea {
    module {
        inheritOutputDirs = true
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'lib', include: ['*.jar'])
    implementation "com.google.guava:guava:33.5.0-jre"
    implementation 'org.reflections:reflections:0.9.10'
    implementation "com.google.code.gson:gson:2.8.9"
    implementation "org.scala-lang:scala-library:2.12.4"
    implementation "com.orsonpdf:orsonpdf:1.8"
    implementation "com.object-refinery:orsoncharts:1.7"
    testImplementation "junit:junit:4.13.1"
    testImplementation "org.hamcrest:hamcrest-core:1.3"
    implementation "com.panayotis:javaplot:0.5.0"
    implementation "gov.nist.math:jama:1.0.3"
    implementation "com.googlecode.efficient-java-matrix-library:ejml:0.25"
    implementation "args4j:args4j:2.33"
    implementation 'org.jfree:jfreechart-swt:1.0'
    implementation 'org.jfree:swtgraphics2d:1.0'
    implementation 'org.jfree:jfreesvg:3.3'
    implementation 'org.jfree:jcommon:1.0.24'
    implementation 'org.jfree:jfreechart:1.0.19'
    implementation 'org.apache.xmlgraphics:batik:1.16'
    implementation 'org.apache.xmlgraphics:batik-svggen:1.16'
    implementation 'org.apache.xmlgraphics:batik-dom:1.16'
    implementation 'org.apache.xmlgraphics:batik-transcoder:1.17'
    implementation 'com.itextpdf:itextpdf:5.5.13.3'
    implementation 'net.sf.epsgraphics:epsgraphics:1.2'
    implementation "org.javassist:javassist:3.24.0-GA"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.12.1"
    implementation 'com.fasterxml.jackson.core:jackson-core:2.16.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.16.1'
    implementation 'org.jetbrains:annotations:13.0'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.apache.commons:commons-rng-core:1.4'
    implementation 'org.apache.commons:commons-rng-simple:1.4'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'commons-io:commons-io:2.14.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

version = '1.0'

jar {
    archiveFileName = 'ears.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Implementation-Title': 'EARS',
                   'Implementation-Version': '1.0',
                   'Main-Class': 'org.um.feri.ears.engine.ExecuteTournaments'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } //include all dependencies in jar
    }
}

sourceSets {
    main {
        java {
            srcDir 'src'
        }
        resources {
            srcDirs 'Weight', 'test_data', 'src', 'res'
        }
   }
}

javafx {
    version = '17.0.7'
    modules = ['javafx.controls', 'javafx.fxml']
}

jlink {
    imageZip = layout.buildDirectory.file("distributions/app-${javafx.platform.classifier}.zip").get().asFile
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'app'
    }
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

kotlin {
    jvmToolchain(17)
}

